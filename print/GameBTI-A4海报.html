<section class="heading"><h1>游戏里，<span class="second">你是哪种人<span class="qmark">？</span></span></h1><p class="intro">和朋友开黑时，你是负责带队的，还是一转眼就跑去捡东西了？<br>按平时玩游戏的习惯答一答，看看会测出什么人格。</p></section>
